name: Update Scholar citations

on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-citations.yml'
      - 'scripts/update_citations.py'
      - 'data/citation-map.json'

permissions:
  contents: write
  pages: write

concurrency:
  group: scholar-citations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch and validate citation counts
        run: python3 scripts/update_citations.py
      - name: Save successful citation snapshot
        id: save
        shell: bash
        run: |
          if git diff --quiet -- index.html data/citations.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/citations.json
          git commit -m 'Update Google Scholar citation snapshot'
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Rebuild an enabled GitHub Pages site
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # GITHUB_TOKEN commits do not trigger the default Pages build.
          # Never create/re-enable a site whose publishing source was disabled.
          if ! gh api "repos/$GITHUB_REPOSITORY/pages" > /tmp/profile-pages.json; then
            echo 'Pages is unavailable or disabled; snapshot saved without enabling it.'
            exit 0
          fi
          if ! python3 -c 'import json; p=json.load(open("/tmp/profile-pages.json")); raise SystemExit(0 if p.get("source",{}).get("branch")=="main" else 1)'; then
            echo 'Pages does not publish from main; leaving its setting unchanged.'
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
